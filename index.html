<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cashi Dino</title>
<link rel="icon" type="image/svg+xml" href="src/favicon.svg">
<link rel="icon" type="image/png" sizes="180x180" href="src/icon-180.png">
<link rel="apple-touch-icon" href="src/icon-180.png">
<style>
  /* Jersey 10 (SIL Open Font License, see FONT_LICENSE_OFL.txt), kept in the game so nothing loads from elsewhere */
  @font-face { font-family: 'Jersey 10'; src: url(src/jersey10.woff2) format('woff2'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #f7f7f7; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #safe { position: fixed; inset: 0; visibility: hidden; pointer-events: none; padding-left: env(safe-area-inset-left, 0px); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<script>
(() => {
  // Brand colours, plus the grey of the offline game
  const YELLOW = '#FFAE00', PURPLE = '#3E2B9A', IVORY = '#FFFCF5';
  const MONO_BG = '#f7f7f7', MONO_INK = '#535353';

  // World is 300 units tall; the screen scales to fit
  const WORLD_H = 300, MIN_W = 520, MIN_W_UPRIGHT = 360;
  const STREET_H = 236, GROUND_Y = 262, ROAD_BOTTOM = 280;
  const DINO_H = 96, DINO_W = DINO_H * 275 / 260, DINO_PAD = 8;
  const TILE_W = STREET_H * 496 / 480;            // one block of shops
  // The street repeats every 5 blocks. Blocks 1 and 4 have a yellow Cashi Merchant tea stall,
  // and the CashiPlus store stands in the shop line where block 2 meets block 3.
  // Blocks 0 and 2 get a Cashi sign on the tuk tuk.
  const CYCLE = 5, MERCHANT_BLOCKS = [1, 4], TUKTUK_BLOCKS = [0, 2], STORE_AT = 3;
  const STORE_H = 105, STORE_W = STORE_H * 640 / 382, STORE_BASE = 226;
  const GRAVITY = 1900, JUMP_V = 640;
  const START_SPEED = 260, ACCEL = 7;
  // From 1,500 points the game keeps getting harder, reaching its hardest at 5,000:
  // up to 80 faster, tighter gaps, more rows and fewer quiet stretches. Every gap stays jumpable.
  const COIN_W = 20, COIN_DEPTH = 3, COIN_POINTS = 100;
  const HARD_FROM = 1500, HARD_AT = 5000, HARD_SPEED = 80;
  const hardness = () => Math.min(1, Math.max(0, (score - HARD_FROM) / (HARD_AT - HARD_FROM)));
  let maxSpeed = 640; // lower on upright phones, which see less of the road ahead
  const REVEAL_TIME = 1.3;
  const LINKS = {
    app: 'https://getcashi.com/ar/links',
    bankak: 'https://youtube.com/shorts/tziwyQtkj5U',
    fawry: 'https://youtube.com/shorts/59E-KPfbuAE',
    ocash: 'https://youtube.com/shorts/VMH-85NfBmA'
  };
  const shareText = s => [
    'Cashi apps are DATA FREE for Zain users.',
    '', `I got ${s} on the Cashi dino. Bet you can't beat me 😏`, location.href.split(/[?#]/)[0],
    '', `Get the app: ${LINKS.app}`,
    '', 'How to top up Cashi:', `Bankak: ${LINKS.bankak}`,
    '', `Fawry: ${LINKS.fawry}`,
    '', `OCash: ${LINKS.ocash}`
  ].join('\n');

  // Older Android browsers lack rounded rectangles on canvas
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
      this.closePath();
    };
  }

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let scale = 1, viewW = MIN_W, offsetY = 0, dpr = 1, ppu = 1, hudX = 14;
  // Moving things land on whole screen pixels, so they glide evenly instead of jumping in coarse steps
  const snap = v => Math.round(v * ppu) / ppu;

  // Images are resized once to their size on screen, so each frame is a plain copy (easier on slow phones)
  const sized = new Map();
  function drawSized(i, x, y, w, h) {
    let bySize = sized.get(i);
    if (!bySize) sized.set(i, bySize = new Map());
    let c = bySize.get(w);
    if (!c) {
      c = document.createElement('canvas');
      c.width = Math.ceil(w * ppu); c.height = Math.ceil(h * ppu);
      const g = c.getContext('2d');
      g.imageSmoothingQuality = 'high';
      g.drawImage(i, 0, 0, c.width, c.height);
      bySize.set(w, c);
    }
    ctx.drawImage(c, snap(x), snap(y), c.width / ppu, c.height / ppu);
  }

  const ART_VERSION = 2; // raise when an image changes so browsers fetch the new one
  const img = name => { const i = new Image(); i.src = 'src/' + name + '?v=' + ART_VERSION; return i; };
  const art = { dino: img('dino.png'), dinoGrey: img('dino_grey.png'), street: img('street.jpg'), merchant: img('street_merchant.jpg'), tuktuk: img('street_tuktuk.jpg'), store: img('store.png'), pickup: img('pickup.png') };
  const ready = i => i.complete && i.naturalWidth > 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    // phones held upright show a narrower slice so the game stays big
    scale = Math.min(h / WORLD_H, w / (w < h ? MIN_W_UPRIGHT : MIN_W));
    maxSpeed = w < h ? 520 : 640;
    viewW = w / scale;
    offsetY = (h - WORLD_H * scale) / 2;
    // keep the score clear of a phone notch when held sideways
    ppu = dpr * scale;
    sized.clear();
    hudX = 14 + (parseFloat(getComputedStyle(document.getElementById('safe')).paddingLeft) || 0) / scale;
  }
  window.addEventListener('resize', resize);
  resize();

  // Obstacles from a Sudanese street: an ushar bush, stacked tyres and red jerry cans.
  // Each is a clean illustration with outlines like the street art, painted once at 4x into its own canvas.
  const LINE = '#1f1846'; // the same dark outline as the plane
  const OB_K = 4;

  // Stack of tyres lying flat: treaded sides, and the top tyre shows its hole
  function paintTyres(g, n, w, h) {
    const rx = w / 2, ry = 5, band = (h - 2 * ry) / n;
    for (let i = 0; i < n; i++) {
      const bot = h - ry - i * band, top = bot - band;
      g.beginPath();
      g.moveTo(0, top); g.lineTo(0, bot);
      g.ellipse(rx, bot, rx, ry, 0, Math.PI, 0, true);
      g.lineTo(w, top); g.closePath();
      g.fillStyle = '#2f2f36'; g.fill();
      g.save(); g.clip();
      g.fillStyle = '#4a4a54'; g.fillRect(0, top + 1.5, w, 2.2);      // rounded shoulder catching the light
      g.fillStyle = '#1b1b20';
      for (let x = 2.5; x < w - 1; x += 4.2) g.fillRect(x, top + 5, 1.8, band - 5); // tread blocks
      g.restore();
      g.stroke();
    }
    const top = ry;
    g.beginPath(); g.ellipse(rx, top, rx, ry, 0, 0, Math.PI * 2);
    g.fillStyle = '#3d3d46'; g.fill(); g.stroke();
    g.beginPath(); g.ellipse(rx, top, rx * 0.8, ry * 0.8, 0, 0, Math.PI * 2);
    g.strokeStyle = '#5c5c68'; g.lineWidth = 0.8; g.stroke();
    g.beginPath(); g.ellipse(rx, top + 0.4, rx * 0.5, ry * 0.5, 0, 0, Math.PI * 2);
    g.fillStyle = '#0d0d10'; g.fill(); g.strokeStyle = LINE; g.lineWidth = 1.2; g.stroke();
  }

  // Red metal jerry can: three bar handle, spout cap, and the X pressed into its side
  function paintCan(g, w, h) {
    const bodyTop = 9;
    g.beginPath(); g.roundRect(1, 1, w * 0.6, bodyTop + 2, 2.5);    // handle bar
    g.fillStyle = '#b52e25'; g.fill(); g.stroke();
    g.beginPath();                                                    // body with the corner cut by the spout
    g.moveTo(2, bodyTop); g.lineTo(w * 0.66, bodyTop); g.lineTo(w - 1, bodyTop + 6);
    g.lineTo(w - 1, h - 2); g.quadraticCurveTo(w - 1, h - 1, w - 2.5, h - 1);
    g.lineTo(2.5, h - 1); g.quadraticCurveTo(1, h - 1, 1, h - 2.5);
    g.lineTo(1, bodyTop + 1.5); g.quadraticCurveTo(1, bodyTop, 2, bodyTop); g.closePath();
    g.fillStyle = '#d63a2e'; g.fill();
    g.save(); g.clip();
    g.fillStyle = '#a82a22'; g.fillRect(w - 5, 0, 5, h);              // shaded side
    g.fillStyle = '#ef6a55'; g.fillRect(1, bodyTop, 2.4, h);          // lit edge
    g.restore();
    g.stroke();
    const px = 5, py = bodyTop + 5, pw = w - 11, ph = h - bodyTop - 9; // pressed panel with the X
    g.strokeStyle = '#9e271f'; g.lineWidth = 1;
    g.strokeRect(px, py, pw, ph);
    g.lineWidth = 2.4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(px + 1.5, py + 1.5); g.lineTo(px + pw - 1.5, py + ph - 1.5);
    g.moveTo(px + pw - 1.5, py + 1.5); g.lineTo(px + 1.5, py + ph - 1.5); g.stroke();
    g.strokeStyle = '#f07d68'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(px + 1, py + 1); g.lineTo(px + pw - 2, py + ph - 2);
    g.moveTo(px + pw - 1, py + 1); g.lineTo(px + 2, py + ph - 2); g.stroke();
    g.strokeStyle = LINE; g.lineWidth = 1.2; g.lineCap = 'butt';
    g.save(); g.translate(w * 0.8, bodyTop + 1); g.rotate(Math.PI / 5); // spout cap
    g.beginPath(); g.roundRect(-3, -6, 6, 6, 1.2); g.fillStyle = '#e8c547'; g.fill(); g.stroke();
    g.restore();
    g.globalCompositeOperation = 'destination-out';                  // the gaps in the handle
    g.beginPath(); g.roundRect(3.5, 3.5, w * 0.17, 4, 1.5); g.roundRect(4.5 + w * 0.22, 3.5, w * 0.17, 4, 1.5); g.fill();
    g.globalCompositeOperation = 'source-over';
    g.beginPath(); g.roundRect(3.5, 3.5, w * 0.17, 4, 1.5); g.roundRect(4.5 + w * 0.22, 3.5, w * 0.17, 4, 1.5); g.stroke();
  }

  // Ushar (Sodom apple) bush: big grey green leaves in pairs, white and purple flowers, one balloon fruit
  function paintBush(g, w, h) {
    g.fillStyle = '#b98252';                                          // little mound of dirt
    g.beginPath(); g.ellipse(w / 2, h - 2, w * 0.36, 3, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#7d6a4a'; g.lineWidth = 2; g.lineCap = 'round';  // stems
    const stems = [[w * 0.5, 4], [w * 0.28, 9], [w * 0.74, 8]];
    stems.forEach(([x, top]) => { g.beginPath(); g.moveTo(w / 2, h - 2); g.quadraticCurveTo(x, h * 0.6, x, top); g.stroke(); });
    const leaf = (x, y, r, a) => {
      g.save(); g.translate(x, y); g.rotate(a);
      g.beginPath(); g.ellipse(0, 0, r, r * 0.6, 0, 0, Math.PI * 2);
      g.fillStyle = '#9fbf86'; g.fill();
      g.fillStyle = '#7fa168'; g.beginPath(); g.ellipse(0, r * 0.18, r * 0.95, r * 0.4, 0, 0, Math.PI); g.fill();
      g.strokeStyle = LINE; g.lineWidth = 0.9; g.beginPath(); g.ellipse(0, 0, r, r * 0.6, 0, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = '#dfe9cf'; g.lineWidth = 0.7; g.beginPath(); g.moveTo(-r * 0.75, 0); g.lineTo(r * 0.75, 0); g.stroke();
      g.restore();
    };
    [[w * 0.2, h * 0.72, 9, 0.5], [w * 0.8, h * 0.7, 9, -0.5], [w * 0.36, h * 0.8, 8, 0.2], [w * 0.64, h * 0.8, 8, -0.2],
     [w * 0.16, h * 0.42, 8, -0.4], [w * 0.4, h * 0.5, 8, 0.6], [w * 0.62, h * 0.47, 8, -0.6], [w * 0.86, h * 0.4, 8, 0.4],
     [w * 0.3, h * 0.24, 7, -0.5], [w * 0.7, h * 0.24, 7, 0.5], [w * 0.5, h * 0.3, 7, 1.4]].forEach(l => leaf(...l));
    g.lineWidth = 0.8;
    [[w * 0.5, 4], [w * 0.28, 9], [w * 0.74, 8]].forEach(([x, y]) => {   // flower clusters
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + 0.4, fx = x + Math.cos(a) * 2.6, fy = y + Math.sin(a) * 2;
        g.beginPath(); g.arc(fx, fy, 1.9, 0, Math.PI * 2); g.fillStyle = '#f7f0fb'; g.fill(); g.strokeStyle = LINE; g.stroke();
        g.beginPath(); g.arc(fx, fy, 0.8, 0, Math.PI * 2); g.fillStyle = '#8e4fae'; g.fill();
      }
    });
    g.beginPath(); g.ellipse(w * 0.9, h * 0.6, 4, 5, 0.3, 0, Math.PI * 2);     // balloon fruit
    g.fillStyle = '#a9cf6a'; g.fill(); g.strokeStyle = LINE; g.lineWidth = 1; g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.ellipse(w * 0.88, h * 0.56, 1.2, 1.8, 0.3, 0, Math.PI * 2); g.fill();
  }

  const OBSTACLES = [
    { w: 52, h: 42, paint: paintBush },
    { w: 44, h: 36, paint: (g, w, h) => paintTyres(g, 2, w, h) },
    { w: 44, h: 50, paint: (g, w, h) => paintTyres(g, 3, w, h) },
    { w: 28, h: 40, paint: paintCan },
    { w: 58, h: 40, paint: (g, w, h) => { paintCan(g, 28, h); g.translate(30, 0); paintCan(g, 28, h); } }
  ];

  // The white pickup, cut from the designer's street art. Now and then a smaller one is an obstacle,
  // only once the game is fast enough to clear it. Hit boxes follow the bed, cab and bonnet.
  const PICKUP_H = 48, PICKUP_W = PICKUP_H * 331 / 121, PICKUP_SPEED = 370;
  const PICKUP_BOXES = [[0, 0.34, 0.33, 0.66], [0.33, 0, 0.40, 1], [0.73, 0.36, 0.27, 0.64]];
  // A full size one is parked in block 3, in front of that block's tuk tuk
  // From 2 minutes in, a pterodactyl flies in low (jump it) or high (stay on the ground, a jump hits it).
  // Only its head and body count as a hit, not the wing tips.
  const PTERO_W = 64, PTERO_H = 40, PTERO_FROM = 120, PTERO_LOW = GROUND_Y - 45, PTERO_HIGH = GROUND_Y - 138;
  const PTERO_BOXES = [[0, 0.3, 0.4, 0.25], [0.34, 0.35, 0.5, 0.33]];
  const PICKUP_AT = 3, PARK_X = 66 * TILE_W / 496, PARK_W = 331 * TILE_W / 496, PARK_H = 121 * TILE_W / 496;

  // ready: grey offline look. reveal: colour sweeps in. playing. over.
  let state = 'ready', revealStart = 0, overAt = 0, buttons = [], topupOpen = false, plane = null, nextPlaneAt = 3, zain = null, nextZainAt = 0, zainMark = null;
  let speed, distance, score, obstacles, nextGap, streetX, roadX, dino, time = 0, dust, puffs, jumpAt = -9;
  let coins, coinCount, pops, runTime;

  function reset(firstRun) {
    speed = START_SPEED; distance = 0; score = 0;
    obstacles = []; coins = []; coinCount = 0; pops = []; runTime = 0; nextGap = firstRun ? 760 : 420; roadX = 0; dust = []; puffs = []; jumpAt = -9; topupOpen = false;
    streetX = TILE_W * STORE_AT - viewW / 2; // CashiPlus store sits mid screen when the colour arrives
    dino = { x: 46, y: GROUND_Y - DINO_H, vy: 0, grounded: true };
  }
  reset(true);

  function openLink(url) {
    const w = window.open(url, '_blank');
    if (w) w.opener = null; else location.href = url;
  }
  const shareOnWhatsApp = () => openLink('https://wa.me/?text=' + encodeURIComponent(shareText(score)));
  const buttonAt = (wx, wy) => buttons.find(b => wx >= b.x && wx <= b.x + b.w && wy >= b.y && wy <= b.y + b.h);

  function tap(wx, wy) {
    if (state === 'ready') {
      state = 'reveal'; revealStart = time; nextPlaneAt = time + REVEAL_TIME + 1.5; nextZainAt = time + REVEAL_TIME + 4;
      if (!zainMark) zainMark = img('zain_mark.png'); // small, and only fetched once the game has started
      return;
    }
    if (state === 'over') {
      if (time - overAt < 0.5) return; // a late jump tap should not restart straight away
      if (wx !== undefined && buttonAt(wx, wy)) return; // buttons act on click, so links open in a new tab on phones
      if (topupOpen) { topupOpen = false; return; }
      reset(false); state = 'playing'; return;
    }
    if (state === 'playing' && dino.grounded) { dino.vy = -JUMP_V; dino.grounded = false; jumpAt = time; kickUp(10, 1); }
  }

  // Sand clouds behind the feet on take off (big) and landing (small)
  function kickUp(n, power) {
    for (let i = 0; i < n; i++) {
      const life = 0.35 + Math.random() * 0.25 * power;
      puffs.push({
        x: dino.x + DINO_W * (0.15 + Math.random() * 0.3), y: GROUND_Y - 2 - Math.random() * 6,
        vx: -(15 + Math.random() * 60) * power, vy: -(15 + Math.random() * 45) * power,
        r: (6 + Math.random() * 6) * (0.6 + power * 0.4), life, max: life
      });
    }
  }
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); tap(e.clientX / scale, (e.clientY - offsetY) / scale); });
  canvas.addEventListener('click', e => {
    if (state !== 'over' || time - overAt < 0.5) return;
    const b = buttonAt(e.clientX / scale, (e.clientY - offsetY) / scale);
    if (b) b.act();
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); tap(); }
  });

  const pick = list => list[Math.floor(Math.random() * list.length)];
  const LOW = [OBSTACLES[0], OBSTACLES[1], OBSTACLES[3]]; // bush, two tyres, one can: short enough to clear in a row

  // Once the game is fast enough, some obstacles come in a row of 2 or 3 that one long jump clears.
  // Gaps vary, with the odd quiet stretch, so the rhythm never settles.
  function spawn() {
    const r = Math.random(), k = hardness();
    const count = speed >= 450 && r < 0.2 + 0.15 * k ? 3 : speed >= 340 && r < 0.4 + 0.25 * k ? 2 : 1;
    let x = viewW + 20;
    if (count === 1 && speed >= PICKUP_SPEED && Math.random() < 0.12 && ready(art.pickup)) {
      obstacles.push({ pickup: true, x, y: GROUND_Y - PICKUP_H + 2, w: PICKUP_W, h: PICKUP_H });
    } else if (count === 1 && runTime >= PTERO_FROM && Math.random() < 0.25) {
      obstacles.push({ ptero: true, x, y: Math.random() < 0.5 ? PTERO_LOW : PTERO_HIGH, w: PTERO_W, h: PTERO_H });
    } else for (let n = 0; n < count; n++) {
      const kind = count > 1 ? pick(LOW) : pick(OBSTACLES);
      const { w, h } = kind;
      obstacles.push({ kind, x, y: GROUND_Y - h + 2, w, h });
      x += w + 2;
    }
    nextGap = speed * (0.9 - 0.3 * k) + 140 +
      (Math.random() < 0.2 - 0.12 * k ? 350 + Math.random() * 450 : Math.random() * (300 - 120 * k));

    // Now and then a coin: high over the obstacle, which needs a well timed jump, or in the gap after it,
    // where a second jump for it can leave you landing on the next obstacle
    if (Math.random() < 0.3) {
      const first = obstacles[obstacles.length - count], tail = obstacles[obstacles.length - 1], end = tail.x + tail.w;
      coins.push(Math.random() < 0.5 && first.y !== PTERO_HIGH   // nothing over a high pterodactyl
        ? { x: (first.x + end) / 2 - COIN_W / 2, y: GROUND_Y - 190 + Math.random() * 20 }
        : { x: end + nextGap / 2 - COIN_W / 2, y: GROUND_Y - 165 + Math.random() * 40 });
    }
  }

  function dinoBoxes() {
    const x = dino.x, y = dino.y;
    return [
      { x: x + DINO_W * 0.14, y: y + DINO_H * 0.42, w: DINO_W * 0.62, h: DINO_H * 0.55 },
      { x: x + DINO_W * 0.60, y: y + DINO_H * 0.05, w: DINO_W * 0.34, h: DINO_H * 0.33 }
    ];
  }
  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  function update(dt) {
    time += dt;
    if (state === 'reveal' && time - revealStart >= REVEAL_TIME) state = 'playing';
    if (state !== 'playing') return;
    runTime += dt;

    speed = Math.min(maxSpeed + HARD_SPEED * hardness(), speed + ACCEL * dt);
    const move = speed * dt;
    distance += move;
    score = Math.floor(distance / 12) + coinCount * COIN_POINTS;
    streetX += move * 0.25;
    roadX += move;

    // A Cashi plane crosses the sky now and then
    if (!plane && !zain && time > nextPlaneAt) plane = { x: viewW + 10, y: 22 + Math.random() * 30, v: 70 + Math.random() * 30 };
    if (plane) {
      plane.x -= plane.v * dt;
      if (plane.x < -PLANE_W - BANNER_ROOM) { plane = null; nextPlaneAt = time + 6 + Math.random() * 10; }
    }
    // The Zain logo floats across the sky when the plane is away, drifting with the buildings
    // and never taking more than 6 seconds to cross
    if (!zain && !plane && time > nextZainAt && zainMark && ready(zainMark)) zain = { x: viewW + 10, y: 26 + Math.random() * 24 };
    if (zain) {
      zain.x -= Math.max(move * 0.25, (viewW + 20 + ZAIN_W) / 6 * dt);
      if (zain.x < -ZAIN_W - 10) { zain = null; nextZainAt = time + 8 + Math.random() * 10; }
    }

    dino.vy += GRAVITY * dt;
    dino.y += dino.vy * dt;
    if (dino.y >= GROUND_Y - DINO_H) {
      if (!dino.grounded) kickUp(4, 0.5);
      dino.y = GROUND_Y - DINO_H; dino.vy = 0; dino.grounded = true;
    }
    puffs.forEach(p => { p.x += (p.vx - speed) * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt; });
    puffs = puffs.filter(p => p.life > 0);

    if (dino.grounded && Math.random() < 0.35) dust.push({ x: dino.x + 20, y: GROUND_Y - 4, life: 0.35 });
    dust.forEach(d => { d.x -= move; d.life -= dt; });
    dust = dust.filter(d => d.life > 0);

    obstacles.forEach(o => { o.x -= move; });
    obstacles = obstacles.filter(o => o.x + o.w > -20);
    coins.forEach(c => { c.x -= move; });
    coins = coins.filter(c => {
      const box = { x: c.x, y: c.y, w: COIN_W, h: COIN_W };
      if (!dinoBoxes().some(b => hit(b, box))) return c.x + COIN_W > -20;
      coinCount++; pops.push({ x: c.x + COIN_W / 2, y: c.y, life: 0.7 });
      return false;
    });
    pops.forEach(p => { p.x -= move * 0.5; p.y -= 40 * dt; p.life -= dt; });
    pops = pops.filter(p => p.life > 0);
    const last = obstacles[obstacles.length - 1];
    if (!last || viewW + 20 - (last.x + last.w) >= nextGap) spawn();

    // One life: any obstacle ends the run
    const boxes = dinoBoxes();
    for (const o of obstacles) {
      const parts = (o.pickup ? PICKUP_BOXES : o.ptero ? PTERO_BOXES : [[0, 0, 1, 1]]).map(([fx, fy, fw, fh]) =>
        ({ x: o.x + fx * o.w + 3, y: o.y + fy * o.h + 3, w: fw * o.w - 6, h: fh * o.h - 3 }));
      if (parts.some(ob => boxes.some(b => hit(b, ob)))) { state = 'over'; overAt = time; break; }
    }
  }

  const wrap = (v, m) => ((v % m) + m) % m;

  // Purple sign above the yellow tea stall
  function drawMerchantSign(tileX) {
    const cx = tileX + 211, w = 66, top = 133;
    ctx.fillStyle = PURPLE;
    ctx.beginPath(); ctx.roundRect(cx - w / 2, top, w, 26, 4); ctx.fill();
    text('Cashi', cx, top + 4, 7, 'center', YELLOW, null);
    text('Merchant', cx, top + 14, 7, 'center', YELLOW, null);
  }

  // Purple Cashi sign on the rear side panel of the tuk tuk
  function drawTuktukSign(tileX) {
    // The tuk tuk body is painted purple in the art; the name sits on its side panel
    ctx.font = font(5);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillStyle = OUTLINE; ctx.fillText('Cashi', tileX + 95, 212);
    ctx.fillStyle = YELLOW; ctx.fillText('Cashi', tileX + 94.5, 211.5);
  }

  // Yellow and purple Cashi plane, drawn as a clean illustration with outlines like the street art.
  // Painted once at 4x into its own canvas; nose points left. Box is 140 x 48 units.
  const PLANE_W = 140, PLANE_H = 48, PLANE_K = 4, OUTLINE = '#1f1846';
  const BANNER = 'Recharge Cashi with BBAN', BANNER_SIZE = 8, BANNER_ROOM = 200; // room behind the plane for the banner
  let planeImg = null;
  function paintPlane() {
    const c = document.createElement('canvas');
    c.width = PLANE_W * PLANE_K; c.height = PLANE_H * PLANE_K;
    const g = c.getContext('2d');
    g.scale(PLANE_K, PLANE_K);
    g.lineJoin = 'round'; g.lineWidth = 1.3; g.strokeStyle = OUTLINE;
    const shape = (pts, fill) => {
      g.beginPath(); g.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]);
      g.closePath(); g.fillStyle = fill; g.fill(); g.stroke();
    };
    const body = new Path2D('M16 15 L104 15 C114 15 122 12 131 6 L136 8 C132 18 126 28 116 33 L18 34 C8 34 2 30 2 24.5 C2 19 8 15 16 15 Z');

    shape([104, 16, 117, 0, 130, 0, 131, 8], PURPLE);          // tail fin
    g.save(); g.clip(body);                                     // body with highlight, cheatline and belly shade
    g.fillStyle = YELLOW; g.fillRect(0, 0, PLANE_W, PLANE_H);
    g.fillStyle = '#FFC94D'; g.fillRect(0, 15, PLANE_W, 3);
    g.fillStyle = PURPLE; g.fillRect(0, 28, PLANE_W, 2.2);
    g.fillStyle = '#E39A00'; g.fillRect(0, 30.2, PLANE_W, 10);
    g.restore();
    g.stroke(body);
    shape([8, 20, 17, 19, 17, 23.5, 5.5, 24], '#2C4A7A');       // cockpit window
    g.fillStyle = '#BFE6FF'; g.fillRect(10, 20, 3, 1.4);
    shape([112, 24, 136, 19, 139, 22, 118, 29], PURPLE);        // tail wing
    shape([50, 29, 74, 29, 92, 45, 82, 47], PURPLE);            // main wing
    g.beginPath(); g.roundRect(57, 33, 17, 7, 3.5); g.fillStyle = '#2C1F73'; g.fill(); g.stroke(); // engine
    g.fillStyle = '#5a48c4'; g.fillRect(58.5, 34.2, 3, 4.6);
    return c;
  }
  function drawPlane(p) {
    if (!planeImg) planeImg = paintPlane();
    const x = snap(p.x), y = p.y + Math.sin(time * 2) * 2;

    // Banner towed behind the tail, waving more towards its far end
    ctx.font = font(BANNER_SIZE);
    const bw = ctx.measureText(BANNER).width + 16, bh = 18, bx = x + PLANE_W + 14, by = y + 8;
    ctx.strokeStyle = OUTLINE; ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(x + 136, y + 14); ctx.lineTo(bx, by + 2);
    ctx.moveTo(x + 136, y + 14); ctx.lineTo(bx, by + bh - 2);
    ctx.stroke();
    const wave = u => Math.sin(u * 0.09 - time * 7) * 1.8 * (u / bw);
    ctx.beginPath();
    for (let i = 0; i <= 24; i++) { const u = bw * i / 24; ctx.lineTo(bx + u, by + wave(u)); }
    for (let i = 24; i >= 0; i--) { const u = bw * i / 24; ctx.lineTo(bx + u, by + bh + wave(u)); }
    ctx.closePath();
    ctx.fillStyle = PURPLE; ctx.fill();
    ctx.lineWidth = 1; ctx.stroke();
    text(BANNER, bx + bw / 2, by + 2, BANNER_SIZE, 'center', YELLOW, null);

    drawSized(planeImg, x, y, PLANE_W, PLANE_H);
    text('Cashi', x + 62, y + 14, 10, 'center', PURPLE, null);
  }

  // Zain logo as a rounded purple diamond with depth and a soft shine, painted once at 4x like the plane.
  // The white Zain mark is cut from the logo Zain supplied.
  const ZAIN_W = 60, ZAIN_DEPTH = 4, ZAIN_K = 4;
  let zainImg = null;
  function paintZain() {
    const c = document.createElement('canvas');
    c.width = (ZAIN_W + 2) * ZAIN_K; c.height = (ZAIN_W + ZAIN_DEPTH + 2) * ZAIN_K;
    const g = c.getContext('2d');
    g.scale(ZAIN_K, ZAIN_K); g.translate(1, 1);
    const h = ZAIN_W / 2, rad = 12;
    const diamond = dy => {
      g.beginPath();
      g.moveTo(h / 2, h / 2 + dy);                    // start mid edge so every corner gets rounded
      g.arcTo(h, dy, ZAIN_W, h + dy, rad);
      g.arcTo(ZAIN_W, h + dy, h, ZAIN_W + dy, rad);
      g.arcTo(h, ZAIN_W + dy, 0, h + dy, rad);
      g.arcTo(0, h + dy, h, dy, rad);
      g.closePath();
    };
    g.lineJoin = 'round'; g.lineWidth = 1.3; g.strokeStyle = LINE;
    diamond(ZAIN_DEPTH); g.fillStyle = '#56215a'; g.fill(); g.stroke();      // the side, for depth
    diamond(0);
    const grad = g.createLinearGradient(0, 0, ZAIN_W, ZAIN_W);
    grad.addColorStop(0, '#a556a3'); grad.addColorStop(1, '#73306f');
    g.fillStyle = grad; g.fill();
    g.save(); g.clip();                                                       // shine on the upper left
    g.fillStyle = 'rgba(255,255,255,0.18)';
    g.beginPath(); g.ellipse(h * 0.7, h * 0.55, h * 0.75, h * 0.38, -Math.PI / 4, 0, Math.PI * 2); g.fill();
    g.restore();
    diamond(0); g.stroke();
    const mw = 42, mh = mw * zainMark.naturalHeight / zainMark.naturalWidth;
    g.imageSmoothingQuality = 'high';
    g.drawImage(zainMark, h - mw / 2, h - mh / 2, mw, mh);
    return c;
  }
  function drawZain(z) {
    if (!zainImg) zainImg = paintZain();
    drawSized(zainImg, z.x - 1, z.y - 1 + Math.sin(time * 1.6) * 3, ZAIN_W + 2, ZAIN_W + ZAIN_DEPTH + 2);
  }

  function drawStreet() {
    if (!ready(art.street)) return;
    for (let i = Math.floor(streetX / TILE_W); i * TILE_W - streetX < viewW; i++) {
      const x = snap(i * TILE_W - streetX);
      const merchant = MERCHANT_BLOCKS.includes(wrap(i, CYCLE)) && ready(art.merchant);
      const tuktuk = TUKTUK_BLOCKS.includes(wrap(i, CYCLE)) && ready(art.tuktuk);
      drawSized(merchant ? art.merchant : tuktuk ? art.tuktuk : art.street, x, 0, Math.ceil(TILE_W) + 1, STREET_H);
      if (merchant) drawMerchantSign(x);
      if (tuktuk) drawTuktukSign(x);
    }
    if (!ready(art.store)) return;
    for (let k = Math.floor((streetX - STORE_AT * TILE_W) / (CYCLE * TILE_W)); ; k++) {
      const c = (STORE_AT + k * CYCLE) * TILE_W - streetX;
      if (c - STORE_W / 2 > viewW) break;
      if (c + STORE_W / 2 < 0) continue;
      ctx.fillStyle = 'rgba(90,50,20,0.25)';
      ctx.beginPath(); ctx.ellipse(c, STORE_BASE - 1, STORE_W * 0.5, 4, 0, 0, Math.PI * 2); ctx.fill();
      drawSized(art.store, c - STORE_W / 2, STORE_BASE - STORE_H, STORE_W, STORE_H);
    }
    if (!ready(art.pickup)) return;
    for (let i = Math.floor(streetX / TILE_W); i * TILE_W - streetX < viewW; i++) {
      if (wrap(i, CYCLE) === PICKUP_AT) drawSized(art.pickup, i * TILE_W - streetX + PARK_X, STREET_H - PARK_H, PARK_W, PARK_H);
    }
  }

  function drawRoad() {
    ctx.fillStyle = '#d49d65'; ctx.fillRect(0, STREET_H, viewW, ROAD_BOTTOM - STREET_H);
    ctx.fillStyle = '#b98252'; ctx.fillRect(0, STREET_H, viewW, 3);
    ctx.fillStyle = '#f3e4c6';
    const dash = 44, gap = 36;
    for (let x = -(roadX % (dash + gap)); x < viewW; x += dash + gap) ctx.fillRect(snap(x), 250, dash, 4);
    ctx.fillStyle = '#fad46f'; ctx.fillRect(0, ROAD_BOTTOM, viewW, WORLD_H - ROAD_BOTTOM + 400);
    ctx.fillStyle = '#e0b552';
    for (let i = 0; i < 14; i++) {
      const px = ((i * 97 - roadX) % (viewW + 40) + viewW + 40) % (viewW + 40) - 20;
      ctx.fillRect(snap(px), ROAD_BOTTOM + 6 + (i * 37) % 14, 6, 3);
    }
  }

  // Each obstacle is painted once into its own small canvas, which keeps slow phones smooth
  const obstacleCache = new Map();
  function obstacleImage(kind) {
    if (obstacleCache.has(kind)) return obstacleCache.get(kind);
    const c = document.createElement('canvas');
    c.width = (kind.w + 2) * OB_K; c.height = (kind.h + 2) * OB_K;
    const g = c.getContext('2d');
    g.scale(OB_K, OB_K); g.translate(1, 1);
    g.lineJoin = 'round'; g.lineWidth = 1.2; g.strokeStyle = LINE;
    kind.paint(g, kind.w, kind.h);
    obstacleCache.set(kind, c);
    return c;
  }
  // Pterodactyl, after the one in the designer's street art: tan with a dark outline, beak and crest pointing
  // the way it flies. Two wing positions, swapped to flap. Painted once at 4x.
  const pteroImgs = [];
  function paintPtero(up) {
    const c = document.createElement('canvas');
    c.width = (PTERO_W + 2) * OB_K; c.height = (PTERO_H + 2) * OB_K;
    const g = c.getContext('2d');
    g.scale(OB_K, OB_K); g.translate(1, 1);
    g.lineJoin = 'round'; g.lineCap = 'round'; g.lineWidth = 1.2; g.strokeStyle = LINE;
    const shape = (pts, fill) => {
      g.beginPath(); g.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length; i += 4) g.quadraticCurveTo(pts[i], pts[i + 1], pts[i + 2], pts[i + 3]);
      g.closePath(); g.fillStyle = fill; g.fill(); g.stroke();
    };
    // far wing, in shade behind the body
    if (up) shape([26, 18, 14, 12, 6, 1, 22, 5, 33, 16], '#97512a');
    else shape([27, 20, 20, 28, 12, 37, 24, 31, 34, 22], '#97512a');
    // legs trailing back
    g.beginPath(); g.moveTo(42, 25); g.lineTo(49, 30); g.moveTo(45, 24); g.lineTo(52, 28); g.stroke();
    // body and tail
    shape([22, 20, 30, 14, 44, 18, 50, 21, 56, 23, 46, 26, 36, 27, 28, 26, 22, 20], '#c9773a');
    // head: long beak forward, crest swept back
    shape([24, 17, 18, 12, 13, 13, 6, 15, 0, 19, 8, 20, 14, 20, 20, 22, 25, 22], '#c9773a');
    shape([15, 13, 21, 9, 30, 6, 24, 11, 20, 14], '#ad602f');
    g.fillStyle = LINE; g.beginPath(); g.arc(14, 15.5, 1.1, 0, Math.PI * 2); g.fill();
    // near wing, in front
    if (up) shape([29, 19, 34, 6, 62, 0, 52, 13, 46, 21], '#de8c48');
    else shape([29, 21, 38, 35, 58, 39, 52, 27, 46, 22], '#de8c48');
    // membrane fold line
    g.lineWidth = 0.8; g.strokeStyle = '#97512a'; g.beginPath();
    if (up) { g.moveTo(37, 17); g.quadraticCurveTo(45, 10, 55, 5); } else { g.moveTo(37, 22); g.quadraticCurveTo(45, 28, 53, 34); }
    g.stroke();
    return c;
  }

  function drawObstacle(o) {
    if (o.pickup) { drawSized(art.pickup, o.x, o.y, o.w, o.h); return; }
    if (o.ptero) {
      const up = Math.floor(time * 6) % 2;
      if (!pteroImgs[up]) pteroImgs[up] = paintPtero(up);
      drawSized(pteroImgs[up], o.x - 1, o.y - 1, PTERO_W + 2, PTERO_H + 2);
      return;
    }
    drawSized(obstacleImage(o.kind), o.x - 1, o.y - 1, o.w + 2, o.h + 2);
  }


  // Cashi yellow diamond coin with depth and a shine, painted once at 4x like the Zain logo
  let coinImg = null;
  function paintCoin() {
    const c = document.createElement('canvas');
    c.width = (COIN_W + 2) * OB_K; c.height = (COIN_W + COIN_DEPTH + 2) * OB_K;
    const g = c.getContext('2d');
    g.scale(OB_K, OB_K); g.translate(1, 1);
    const h = COIN_W / 2, rad = 4;
    const diamond = (dy, inset = 0) => {
      const a = inset, b = COIN_W - inset;
      g.beginPath();
      g.moveTo((a + h) / 2, (a + h) / 2 + dy);
      g.arcTo(h, a + dy, b, h + dy, rad);
      g.arcTo(b, h + dy, h, b + dy, rad);
      g.arcTo(h, b + dy, a, h + dy, rad);
      g.arcTo(a, h + dy, h, a + dy, rad);
      g.closePath();
    };
    g.lineJoin = 'round'; g.lineWidth = 1.2; g.strokeStyle = LINE;
    diamond(COIN_DEPTH); g.fillStyle = '#c47a00'; g.fill(); g.stroke();
    diamond(0);
    const grad = g.createLinearGradient(0, 0, COIN_W, COIN_W);
    grad.addColorStop(0, '#ffd257'); grad.addColorStop(1, YELLOW);
    g.fillStyle = grad; g.fill();
    g.save(); g.clip();
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.beginPath(); g.ellipse(h * 0.7, h * 0.55, h * 0.7, h * 0.32, -Math.PI / 4, 0, Math.PI * 2); g.fill();
    g.restore();
    diamond(0); g.stroke();
    diamond(0, 5.5); g.strokeStyle = '#d98f00'; g.lineWidth = 1.4; g.stroke();
    return c;
  }
  function drawCoins() {
    if (!coinImg) coinImg = paintCoin();
    coins.forEach(c => drawSized(coinImg, c.x - 1, c.y - 1 + Math.sin(time * 5 + c.x * 0.05) * 2, COIN_W + 2, COIN_W + COIN_DEPTH + 2));
    pops.forEach(p => {
      ctx.globalAlpha = Math.min(1, p.life / 0.35);
      text('+' + COIN_POINTS, p.x, p.y - 4, 9, 'center', PURPLE, YELLOW);
    });
    ctx.globalAlpha = 1;
  }

  function drawJumpFx() {
    puffs.forEach(p => {
      const t = 1 - p.life / p.max, r = p.r * (1 + t * 0.8);
      ctx.globalAlpha = Math.min(1, (p.life / p.max) * 1.6);
      ctx.fillStyle = '#d9bf8c'; ctx.beginPath(); ctx.arc(p.x, p.y + 1.5, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f6ead2'; ctx.beginPath(); ctx.arc(p.x - 0.5, p.y, r * 0.88, 0, Math.PI * 2); ctx.fill();
    });
    // Speed lines trail down and back from the feet just after take off
    const since = time - jumpAt;
    if (since < 0.35) {
      ctx.globalAlpha = 0.85 * (1 - since / 0.35);
      ctx.strokeStyle = '#8a6d43'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      const fx = dino.x + DINO_W * 0.35, fy = dino.y + DINO_H * 0.92;
      [[-4, -2, 34], [6, 4, 28], [-14, 6, 22], [-22, -6, 18]].forEach(([dx, dy, len]) => {
        ctx.beginPath(); ctx.moveTo(fx + dx, fy + dy); ctx.lineTo(fx + dx - len * 0.8, fy + dy + len * 0.6); ctx.stroke();
      });
    }
    ctx.globalAlpha = 1;
  }

  function drawDino(image) {
    if (!ready(image)) return;
    const bob = dino.grounded && state === 'playing' ? (Math.floor(time * 10) % 2) * -3 : 0;
    const pad = DINO_PAD * DINO_H / 260; // the outline sits in a margin around the body
    drawSized(image, dino.x - pad, dino.y + bob - pad, DINO_W + 2 * pad, DINO_H + 2 * pad);
  }

  // Jersey 10 draws smaller than its size suggests, so sizes are scaled up here
  const FONT_SCALE = 1.7;
  const font = size => `${size * FONT_SCALE}px "Jersey 10", monospace`;
  if (document.fonts) document.fonts.load(font(10));

  function text(str, x, y, size, align = 'left', color = PURPLE, shadow = IVORY) {
    ctx.font = font(size);
    ctx.textAlign = align; ctx.textBaseline = 'top';
    if (shadow) { ctx.fillStyle = shadow; ctx.fillText(str, x + 2, y + 2); }
    ctx.fillStyle = color; ctx.fillText(str, x, y);
  }

  // Yellow band sized to the letters themselves, so it sits evenly around them
  function highlight(str, x, y, size) {
    ctx.font = font(size); ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    const m = ctx.measureText(str), pad = size * 0.3;
    ctx.fillStyle = YELLOW;
    ctx.fillRect(x - m.actualBoundingBoxLeft - pad, y - m.actualBoundingBoxAscent - pad,
      m.actualBoundingBoxLeft + m.actualBoundingBoxRight + 2 * pad, m.actualBoundingBoxAscent + m.actualBoundingBoxDescent + 2 * pad);
  }

  const scoreText = () => 'SCORE: ' + String(score).padStart(4, '0');

  // The full colour world
  function drawColour() {
    ctx.fillStyle = '#5cc9d6'; ctx.fillRect(0, -offsetY / scale - 1, viewW, offsetY / scale + 2);
    drawStreet();
    if (plane) drawPlane(plane);
    if (zain) drawZain(zain);
    drawRoad();
    obstacles.forEach(drawObstacle);
    drawCoins();
    drawJumpFx();
    drawDino(art.dino);
    ctx.fillStyle = '#f3e4c6';
    dust.forEach(d => { const s = 3 + (0.35 - d.life) * 14; ctx.globalAlpha = d.life / 0.35; ctx.fillRect(d.x, d.y - s, s, s); });
    ctx.globalAlpha = 1;
    text(scoreText(), hudX, 14, 12);
  }

  // The grey offline look the game opens with
  function drawMono() {
    ctx.fillStyle = MONO_BG; ctx.fillRect(0, -offsetY / scale - 1, viewW, WORLD_H + 2 * offsetY / scale + 2);
    ctx.fillStyle = MONO_INK;
    ctx.fillRect(0, GROUND_Y - 1, viewW, 2);
    for (let i = 0; i < 18; i++) ctx.fillRect((i * 61) % viewW, GROUND_Y + 6 + (i * 13) % 12, 2 + (i % 3) * 2, 2);
    [[viewW * 0.55, 70], [viewW * 0.82, 110]].forEach(([cx, cy]) => {
      ctx.fillStyle = '#d6d6d6';
      ctx.fillRect(cx, cy, 46, 4); ctx.fillRect(cx + 8, cy - 6, 26, 6); ctx.fillRect(cx + 16, cy - 10, 12, 4);
    });
    drawDino(art.dinoGrey);
    text(scoreText(), hudX, 14, 12, 'left', MONO_INK, null);
    // Start box: the Zain message and the start prompt together, still in black and white
    // The message is the only colour on the grey screen: purple, with DATA FREE on a yellow band
    if (state === 'ready' || state === 'reveal') { // the colour wipes the box away with everything else
      const w = Math.min(viewW - 32, 300), x = (viewW - w) / 2, top = 54, h = 104;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.roundRect(x, top, w, h, 12); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = PURPLE; ctx.stroke();
      ctx.font = font(13);
      const a = 'Cashi is ', b = 'DATA FREE', aw = ctx.measureText(a).width, bw = ctx.measureText(b).width;
      const lx = (viewW - aw - bw) / 2, ly = top + 16;
      highlight(b, lx + aw, ly, 13);
      text(a, lx, ly, 13, 'left', PURPLE, null);
      text(b, lx + aw, ly, 13, 'left', PURPLE, null);
      text('for Zain users', viewW / 2, top + 44, 13, 'center', PURPLE, null);
      if (Math.floor(time * 2) % 2 === 0) text('TAP TO START', viewW / 2, top + 76, 11, 'center', MONO_INK, null);
    }
  }

  function button(x, y, w, h, label, size, fill, color, act) {
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = PURPLE; ctx.stroke();
    text(label, x + w / 2, y + (h - size * FONT_SCALE) / 2 + size * 0.35, size, 'center', color, null);
    buttons.push({ x, y, w, h, act });
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = MONO_BG; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(ppu, 0, 0, ppu, 0, Math.round(dpr * offsetY));

    if (state === 'ready') { drawMono(); return; }

    drawColour();

    // Colour sweeps in from the left with a blocky pixel edge
    if (state === 'reveal') {
      const p = (time - revealStart) / REVEAL_TIME;
      const edge = p * (viewW + 60) - 30;
      const top = -offsetY / scale - 1, bottom = WORLD_H + offsetY / scale + 1;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(viewW + 1, top);
      for (let y = top, n = 0; y < bottom; y += 16, n++) {
        const x = edge + (n % 2 ? 12 : 0);
        ctx.lineTo(x, y); ctx.lineTo(x, y + 16);
      }
      ctx.lineTo(viewW + 1, bottom);
      ctx.closePath();
      ctx.clip();
      drawMono();
      ctx.restore();
    }

    if (state === 'over') {
      const blink = Math.floor(time * 2) % 2 === 0;
      const w = Math.min(viewW - 32, 400), x = (viewW - w) / 2, top = 30, h = 200;
      ctx.fillStyle = 'rgba(255,252,245,0.96)';
      ctx.beginPath(); ctx.roundRect(x, top, w, h, 12); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = PURPLE; ctx.stroke();
      buttons = [];
      const bw = Math.min(w - 40, 290), bx = (viewW - bw) / 2, half = (bw - 8) / 2;
      if (topupOpen) {
        // Pick a bank to watch its top up video
        text('TOP UP CASHI FROM', viewW / 2, top + 26, 13, 'center');
        const third = (bw - 16) / 3;
        [['Bankak', LINKS.bankak], ['Fawry', LINKS.fawry], ['OCash', LINKS.ocash]].forEach(([label, url], i) =>
          button(bx + i * (third + 8), top + 64, third, 40, label, 10, PURPLE, YELLOW, () => openLink(url)));
        button(bx + half / 2 + 4, top + 124, half, 28, 'BACK', 8, IVORY, PURPLE, () => { topupOpen = false; });
      } else {
        text('GAME OVER', viewW / 2, top + 16, 16, 'center');
        text('SCORE: ' + score, viewW / 2, top + 42, 12, 'center');
        // The Zain message again, with DATA FREE on a yellow band like the start box
        ctx.font = font(10);
        const a = 'Cashi is ', b = 'DATA FREE', c = ' for Zain SIM cards';
        const aw = ctx.measureText(a).width, dw = ctx.measureText(b).width, cw = ctx.measureText(c).width;
        const lx = (viewW - aw - dw - cw) / 2, ly = top + 66;
        highlight(b, lx + aw, ly, 10);
        text(a, lx, ly, 10, 'left', PURPLE, null);
        text(b, lx + aw, ly, 10, 'left', PURPLE, null);
        text(c, lx + aw + dw, ly, 10, 'left', PURPLE, null);
        button(bx, top + 88, bw, 34, 'CHALLENGE A FRIEND', 10, PURPLE, YELLOW, shareOnWhatsApp);
        button(bx, top + 130, half, 28, 'GET THE APP', 8, YELLOW, PURPLE, () => openLink(LINKS.app));
        button(bx + half + 8, top + 130, half, 28, 'HOW TO TOP UP CASHI', 8, YELLOW, PURPLE, () => { topupOpen = true; });
        text('TAP TO PLAY AGAIN', viewW / 2, top + 170, 10, 'center', blink ? PURPLE : '#b07800');
      }
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
